<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            padding: 24px;
        }

        h2 {
            margin-bottom: 16px;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #9ca3af;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .question-box {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
        }

        #feedback {
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0;
            text-align: center;
        }

        .stat-card {
            background: #f9fafb;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-card .val {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-card .lbl {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            background-color: #e5e7eb;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            font-size: 14px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f9fafb;
        }

        .correct-row { background-color: #ecfdf5; }
        .incorrect-row { background-color: #fef2f2; }

        .slide-panel {
            background-color: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-top: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .player-tag {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dotted var(--border);
            font-size: 13px;
        }

        .player-tag:last-child {
            border-bottom: none;
        }

        .user-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h2>Math Quiz Login</h2>
        <div class="form-group">
            <label for="username-input">Enter Your Name</label>
            <input type="text" id="username-input" placeholder="e.g. Alex">
        </div>
        <button class="btn" onclick="saveName()">Continue</button>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" style="display:none;">
        <div class="user-banner">
            <span>Welcome, <strong id="display-username"></strong>!</span>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="changeUser()">Switch User</button>
        </div>

        <h2>Quiz Setup</h2>

        <div class="form-group">
            <label for="game-mode-select">Game Mode</label>
            <select id="game-mode-select" onchange="toggleModeOptions()">
                <option value="test">Test Mode (Timed & Logged)</option>
                <option value="practice">Practice Mode (Untimed)</option>
            </select>
        </div>

        <div class="form-group" id="timer-group">
            <label for="timer-select">Time Per Question</label>
            <select id="timer-select">
                <option value="5">5 Seconds</option>
                <option value="10" selected>10 Seconds</option>
                <option value="15">15 Seconds</option>
            </select>
        </div>

        <div class="form-group">
            <label for="difficulty-select">Difficulty</label>
            <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="form-group">
            <label for="op-select">Operations</label>
            <select id="op-select">
                <option value="mixed" selected>Mixed (+, -, ×, ÷)</option>
                <option value="plus">Addition (+)</option>
                <option value="minus">Subtraction (-)</option>
                <option value="multi">Multiplication (×)</option>
                <option value="div">Division (÷)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="q-count">Number of Questions</label>
            <input type="number" id="q-count" value="10" min="1" max="50">
        </div>

        <button class="btn" onclick="startGame()">Start Quiz</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" style="display:none;">
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>

        <div class="status-row">
            <span id="mode-tag">Question 1 of 10</span>
            <span>Streak: <strong id="streak-val">0</strong> 🔥</span>
            <span>Timer: <strong id="timer-val">10</strong>s</span>
        </div>

        <div class="question-box" id="question">12 + 8</div>

        <div class="form-group">
            <input type="number" id="answer-input" placeholder="Your answer" autocomplete="off">
        </div>

        <button class="btn" onclick="checkAnswer()">Submit</button>
        <div id="feedback"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" style="display:none;">
        <h2>Quiz Completed!</h2>
        <p id="final-stats" style="text-align: center; font-weight: 600;"></p>
        <p id="accuracy-stat" style="text-align: center; color: var(--text-muted); margin-bottom: 16px;"></p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="val" id="stat-today">0</div>
                <div class="lbl">Today</div>
            </div>
            <div class="stat-card">
                <div class="val" id="stat-yesterday">0</div>
                <div class="lbl">Yesterday</div>
            </div>
            <div class="stat-card">
                <div class="val" id="stat-total">0</div>
                <div class="lbl">Yearly Total</div>
            </div>
        </div>

        <label>Leaderboards</label>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('daily', this)">Daily</button>
            <button class="tab-btn" onclick="switchTab('weekly', this)">Weekly</button>
            <button class="tab-btn" onclick="switchTab('monthly', this)">Monthly</button>
            <button class="tab-btn" onclick="switchTab('yearly', this)">Yearly</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <button class="btn btn-secondary" style="margin-bottom: 8px;" onclick="toggleSlide()">
            Today's Active Players <span id="slide-arrow">▼</span>
        </button>
        <div id="slide-panel" class="slide-panel" style="display:none;"></div>

        <label style="margin-top: 16px;">Question Review</label>
        <div style="max-height: 150px; overflow-y: auto; margin-bottom: 16px;">
            <table>
                <thead>
                    <tr>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct</th>
                    </tr>
                </thead>
                <tbody id="review-body"></tbody>
            </table>
        </div>

        <button class="btn" onclick="resetGame()">Play Again</button>
    </div>
</div>

<script>
    let currentUser = localStorage.getItem('mq_current_user') || '';
    let gameMode = 'test';
    let difficulty = 'medium';
    let chosenOp = 'mixed';
    let totalQuestions = 10;
    let currentQuestion = 0;
    let score = 0;
    let streak = 0;
    let timerLimit = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let num1, num2, correctAnswer;
    let questionHistory = [];
    let activeTimeframe = 'daily';

    if (currentUser) {
        document.getElementById('display-username').innerText = currentUser;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function saveName() {
        const val = document.getElementById('username-input').value.trim();
        if (!val) return alert("Please enter your name!");
        currentUser = val;
        localStorage.setItem('mq_current_user', currentUser);
        document.getElementById('display-username').innerText = currentUser;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function changeUser() {
        currentUser = '';
        localStorage.removeItem('mq_current_user');
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';
    }

    function toggleModeOptions() {
        const mode = document.getElementById('game-mode-select').value;
        document.getElementById('timer-group').style.display = mode === 'practice' ? 'none' : 'block';
    }

    function startGame() {
        gameMode = document.getElementById('game-mode-select').value;
        difficulty = document.getElementById('difficulty-select').value;
        chosenOp = document.getElementById('op-select').value;
        timerLimit = gameMode === 'practice' ? 0 : parseInt(document.getElementById('timer-select').value);
        totalQuestions = parseInt(document.getElementById('q-count').value) || 10;
        
        currentQuestion = 0;
        score = 0;
        streak = 0;
        questionHistory = [];

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        nextQuestion();
    }

    function nextQuestion() {
        clearInterval(timerInterval);

        if (currentQuestion >= totalQuestions) {
            endGame();
            return;
        }

        currentQuestion++;
        document.getElementById('progress-bar').style.width = `${((currentQuestion - 1) / totalQuestions) * 100}%`;
        document.getElementById('mode-tag').innerText = `Question ${currentQuestion} of ${totalQuestions}`;
        document.getElementById('streak-val').innerText = streak;
        document.getElementById('feedback').innerText = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        generateQuestion();

        if (timerLimit > 0) {
            timeLeft = timerLimit;
            document.getElementById('timer-val').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        } else {
            document.getElementById('timer-val').innerText = '--';
        }
    }

    function generateQuestion() {
        let op = chosenOp;
        if (op === 'mixed') {
            const ops = ['plus', 'minus', 'multi', 'div'];
            op = ops[Math.floor(Math.random() * ops.length)];
        }

        let symbol = '';

        if (op === 'plus') {
            symbol = '+';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 80) + 20;
                num2 = Math.floor(Math.random() * 80) + 20;
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 800) + 100;
                num2 = Math.floor(Math.random() * 800) + 100;
            } else {
                num1 = Math.floor(Math.random() * 8999) + 1000;
                num2 = Math.floor(Math.random() * 8999) + 1000;
            }
            correctAnswer = num1 + num2;
        } else if (op === 'minus') {
            symbol = '-';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 90) + 10;
                num2 = Math.floor(Math.random() * 90) + 10;
                if (num1 < num2) [num1, num2] = [num2, num1];
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 500) + 100;
                num2 = Math.floor(Math.random() * 500) + 100;
            } else {
                num1 = Math.floor(Math.random() * 2000) + 100;
                num2 = Math.floor(Math.random() * 3000) + 500;
            }
            correctAnswer = num1 - num2;
        } else if (op === 'multi') {
            symbol = '×';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 12) + 2;
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 40) + 10;
                num2 = Math.floor(Math.random() * 20) + 5;
            } else {
                num1 = Math.floor(Math.random() * 90) + 10;
                num2 = Math.floor(Math.random() * 90) + 10;
            }
            correctAnswer = num1 * num2;
        } else if (op === 'div') {
            symbol = '÷';
            if (difficulty === 'easy') {
                num2 = Math.floor(Math.random() * 10) + 2;
                correctAnswer = Math.floor(Math.random() * 12) + 1;
            } else if (difficulty === 'medium') {
                num2 = Math.floor(Math.random() * 25) + 5;
                correctAnswer = Math.floor(Math.random() * 30) + 5;
            } else {
                num2 = Math.floor(Math.random() * 90) + 10;
                correctAnswer = Math.floor(Math.random() * 80) + 10;
            }
            num1 = num2 * correctAnswer;
        }

        document.getElementById('question').innerText = `${num1} ${symbol} ${num2}`;
    }

    function checkAnswer() {
        clearInterval(timerInterval);
        const userAns = parseInt(document.getElementById('answer-input').value);
        const feedback = document.getElementById('feedback');
        const qText = document.getElementById('question').innerText;

        if (isNaN(userAns)) return;

        const isCorrect = (userAns === correctAnswer);
        questionHistory.push({ question: qText, userAns: userAns, correct: correctAnswer, isCorrect: isCorrect });

        if (isCorrect) {
            score++;
            streak++;
            feedback.innerText = "Correct!";
            feedback.style.color = "var(--success-color)";
        } else {
            streak = 0;
            feedback.innerText = `Incorrect. Answer: ${correctAnswer}`;
            feedback.style.color = "var(--danger-color)";
        }

        setTimeout(nextQuestion, 1000);
    }

    function handleTimeout() {
        streak = 0;
        const qText = document.getElementById('question').innerText;
        questionHistory.push({ question: qText, userAns: "Timed Out", correct: correctAnswer, isCorrect: false });
        
        const feedback = document.getElementById('feedback');
        feedback.innerText = `Time's up! Answer: ${correctAnswer}`;
        feedback.style.color = "var(--danger-color)";
        setTimeout(nextQuestion, 1000);
    }

    function endGame() {
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const accuracyPct = Math.round((score / totalQuestions) * 100);
        document.getElementById('final-stats').innerText = `${currentUser}, you scored ${score} out of ${totalQuestions}!`;
        document.getElementById('accuracy-stat').innerText = `Accuracy: ${accuracyPct}%`;

        const reviewBody = document.getElementById('review-body');
        reviewBody.innerHTML = '';
        questionHistory.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = item.isCorrect ? 'correct-row' : 'incorrect-row';
            tr.innerHTML = `<td>${item.question}</td><td>${item.userAns}</td><td>${item.correct}</td>`;
            reviewBody.appendChild(tr);
        });

        if (gameMode !== 'practice') {
            saveScore(score);
        }

        updatePersonalStats();
        renderLeaderboard(activeTimeframe);
        renderSlidePlayers();
    }

    function getWeekKey(d) {
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
        const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
        return `${date.getUTCFullYear()}-W${weekNo}`;
    }

    function saveScore(points) {
        const now = new Date();
        const records = JSON.parse(localStorage.getItem('mq_scores') || '[]');
        
        records.push({
            name: currentUser,
            score: points,
            timestamp: now.getTime(),
            daily: now.toISOString().split('T')[0],
            weekly: getWeekKey(now),
            monthly: `${now.getFullYear()}-${now.getMonth() + 1}`,
            yearly: `${now.getFullYear()}`
        });

        localStorage.setItem('mq_scores', JSON.stringify(records));
    }

    function updatePersonalStats() {
        const records = JSON.parse(localStorage.getItem('mq_scores') || '[]');
        const now = new Date();
        
        const todayStr = now.toISOString().split('T')[0];
        
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().split('T')[0];

        let todayScore = 0;
        let yesterdayScore = 0;
        let totalScore = 0;

        records.forEach(r => {
            if (r.name === currentUser) {
                totalScore += r.score;
                if (r.daily === todayStr) todayScore += r.score;
                if (r.daily === yesterdayStr) yesterdayScore += r.score;
            }
        });

        document.getElementById('stat-today').innerText = todayScore;
        document.getElementById('stat-yesterday').innerText = yesterdayScore;
        document.getElementById('stat-total').innerText = totalScore;
    }

    function switchTab(timeframe, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTimeframe = timeframe;
        renderLeaderboard(timeframe);
    }

    function renderLeaderboard(timeframe) {
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        const records = JSON.parse(localStorage.getItem('mq_scores') || '[]');
        const now = new Date();
        
        let filterKey = '';
        let currentValue = '';

        if (timeframe === 'daily') {
            filterKey = 'daily';
            currentValue = now.toISOString().split('T')[0];
        } else if (timeframe === 'weekly') {
            filterKey = 'weekly';
            currentValue = getWeekKey(now);
        } else if (timeframe === 'monthly') {
            filterKey = 'monthly';
            currentValue = `${now.getFullYear()}-${now.getMonth() + 1}`;
        } else if (timeframe === 'yearly') {
            filterKey = 'yearly';
            currentValue = `${now.getFullYear()}`;
        }

        const filtered = records.filter(item => item[filterKey] === currentValue);
        
        const totals = {};
        filtered.forEach(r => {
            totals[r.name] = (totals[r.name] || 0) + r.score;
        });

        const sorted = Object.keys(totals).map(name => ({
            name: name,
            score: totals[name]
        })).sort((a, b) => b.score - a.score);

        if (sorted.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No scores recorded yet</td></tr>';
            return;
        }

        sorted.slice(0, 5).forEach((item, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>#${idx + 1}</td><td>${item.name}</td><td>${item.score}</td>`;
            tbody.appendChild(tr);
        });
    }

    function toggleSlide() {
        const panel = document.getElementById('slide-panel');
        const arrow = document.getElementById('slide-arrow');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            arrow.innerText = '▼';
        } else {
            panel.style.display = 'block';
            arrow.innerText = '▲';
        }
    }

    function renderSlidePlayers() {
        const panel = document.getElementById('slide-panel');
        panel.innerHTML = '';

        const records = JSON.parse(localStorage.getItem('mq_scores') || '[]');
        const todayStr = new Date().toISOString().split('T')[0];
        
        const todayRecords = records.filter(r => r.daily === todayStr);

        if (todayRecords.length === 0) {
            panel.innerHTML = '<div style="color:#6c757d; text-align:center;">No players active today yet.</div>';
            return;
        }

        const playerScores = {};
        const playerQuizCounts = {};

        todayRecords.forEach(r => {
            playerScores[r.name] = (playerScores[r.name] || 0) + r.score;
            playerQuizCounts[r.name] = (playerQuizCounts[r.name] || 0) + 1;
        });

        Object.keys(playerScores).forEach(name => {
            const div = document.createElement('div');
            div.className = 'player-tag';
            div.innerHTML = `<span>👤 <strong>${name}</strong> (${playerQuizCounts[name]} quiz${playerQuizCounts[name] > 1 ? 'zes' : ''})</span> <span>${playerScores[name]} pts today</span>`;
            panel.appendChild(div);
        });
    }

    function resetGame() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
</body>
</html>
