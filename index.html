<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Quest Pro</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --accent-color: #0d6efd;
            --border-color: #dee2e6;
            --success-color: #198754;
            --danger-color: #dc3545;
        }

        body.teen-theme {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #0d6efd;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .game-card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }

        h1 { font-size: 2rem; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 0.95rem; color: #6c757d; margin-bottom: 20px; }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 0;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group select, 
        .form-group input[type="number"],
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .primary-btn {
            font-size: 1rem;
            padding: 12px 30px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        .primary-btn:hover { opacity: 0.9; }

        #setup-screen, #game-screen, #result-screen { display: none; }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .mode-tag {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .streak-badge { color: #fd7e14; }
        .timer-badge { color: var(--danger-color); }

        .question {
            font-size: 2.2rem;
            margin: 15px 0;
            font-weight: 700;
        }

        .answer-box {
            font-size: 1.8rem;
            width: 160px;
            text-align: center;
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .answer-box:focus { border-color: var(--accent-color); }
        .feedback { font-size: 1.1rem; font-weight: 600; margin-top: 15px; min-height: 25px; }

        .accuracy-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--success-color);
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .leaderboard-table, .review-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.85rem;
        }
        .leaderboard-table th, .leaderboard-table td,
        .review-table th, .review-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        .review-container {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .incorrect-row { background-color: rgba(220, 53, 69, 0.1); }
        .correct-row { background-color: rgba(25, 135, 84, 0.1); }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="game-card">

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1>Math Quest</h1>
        <p class="subtitle">Log in or create an account</p>
        
        <div class="form-group">
            <label for="username-input">Player Name:</label>
            <input type="text" id="username-input" placeholder="e.g. Alex" autofocus>
        </div>

        <div class="form-group">
            <label for="password-input">Password:</label>
            <input type="password" id="password-input" placeholder="Enter password">
        </div>

        <button class="primary-btn" onclick="login()">Login / Register</button>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <div class="user-bar">
            <span>👤 <span id="display-username">Player</span></span>
            <button class="text-btn" onclick="logout()">Switch User</button>
        </div>

        <h1>Game Setup</h1>

        <div class="form-group">
            <label for="game-mode-select">Game Mode:</label>
            <select id="game-mode-select" onchange="toggleModeOptions()">
                <option value="test" selected>Graded Quiz Mode</option>
                <option value="practice">Practice Mode (Untimed & Low Pressure)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="difficulty-select">Difficulty:</label>
            <select id="difficulty-select">
                <option value="easy">Easy (Single Digits)</option>
                <option value="medium" selected>Medium (Standard Math)</option>
                <option value="hard">Hard (Advanced Challenge)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="op-select">Operation Type:</label>
            <select id="op-select">
                <option value="mixed" selected>Mixed (All Operations)</option>
                <option value="plus">Addition (+)</option>
                <option value="minus">Subtraction (-)</option>
                <option value="multi">Multiplication (×)</option>
                <option value="div">Division (÷)</option>
            </select>
        </div>

        <div class="form-group" id="timer-group">
            <label for="timer-select">Timer per Question:</label>
            <select id="timer-select">
                <option value="0" selected>No Timer</option>
                <option value="10">10 Seconds</option>
                <option value="5">5 Seconds (Speed Run)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="q-count">Number of Questions:</label>
            <input type="number" id="q-count" value="10" min="1" max="50">
        </div>

        <button class="primary-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar-fill"></div>
        </div>

        <div id="mode-tag" class="mode-tag">Question 1</div>
        
        <div class="stats-row">
            <span class="streak-badge">🔥 Streak: <span id="streak-val">0</span></span>
            <span class="timer-badge" id="timer-box">⏱️ <span id="timer-val">--</span>s</span>
        </div>

        <div id="question" class="question">?</div>
        <input type="number" id="answer-input" class="answer-box" placeholder="?" autofocus>
        <br>
        <button class="primary-btn" style="margin-top: 15px;" onclick="checkAnswer()">Submit</button>
        <div id="feedback" class="feedback"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen">
        <h1>Game Complete!</h1>
        <p class="subtitle" id="final-stats">You scored 0 out of 10!</p>
        <div class="accuracy-display" id="accuracy-stat">Accuracy: 0%</div>

        <div class="review-container">
            <table class="review-table">
                <thead>
                    <tr>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct</th>
                    </tr>
                </thead>
                <tbody id="review-body"></tbody>
            </table>
        </div>

        <h3 id="leaderboard-title">Top Leaderboard</h3>
        <table class="leaderboard-table" id="leaderboard-table">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>High Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>

        <button class="primary-btn" onclick="resetGame()">Play Again</button>
    </div>

</div>

<script>
    let currentUser = '';
    let gameMode = 'test';
    let difficulty = 'medium';
    let chosenOp = 'mixed';
    let totalQuestions = 10;
    let currentQuestion = 0;
    let score = 0;
    let streak = 0;
    let timerLimit = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let num1, num2, correctAnswer;
    let questionHistory = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } else {
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(164.81, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    function toggleModeOptions() {
        const mode = document.getElementById('game-mode-select').value;
        const timerGroup = document.getElementById('timer-group');
        if (mode === 'practice') {
            timerGroup.style.display = 'none';
        } else {
            timerGroup.style.display = 'block';
        }
    }

    function login() {
        const userInput = document.getElementById('username-input').value.trim();
        const passInput = document.getElementById('password-input').value.trim();

        if (!userInput || !passInput) {
            alert("Please enter both a username and a password.");
            return;
        }

        const storedPassword = localStorage.getItem(`pass_${userInput}`);

        if (storedPassword) {
            if (passInput === storedPassword) {
                currentUser = userInput;
                setupLoggedInUser();
            } else {
                alert("Incorrect password!");
            }
        } else {
            localStorage.setItem(`pass_${userInput}`, passInput);
            currentUser = userInput;
            alert(`Account created for ${currentUser}!`);
            setupLoggedInUser();
        }
    }

    function setupLoggedInUser() {
        document.getElementById('display-username').innerText = currentUser;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    function logout() {
        currentUser = '';
        document.getElementById('username-input').value = '';
        document.getElementById('password-input').value = '';
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';
    }

    function startGame() {
        gameMode = document.getElementById('game-mode-select').value;
        difficulty = document.getElementById('difficulty-select').value;
        chosenOp = document.getElementById('op-select').value;
        timerLimit = gameMode === 'practice' ? 0 : parseInt(document.getElementById('timer-select').value);
        totalQuestions = parseInt(document.getElementById('q-count').value) || 10;
        
        currentQuestion = 0;
        score = 0;
        streak = 0;
        questionHistory = [];

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        nextQuestion();
    }

    function nextQuestion() {
        clearInterval(timerInterval);

        if (currentQuestion >= totalQuestions) {
            endGame();
            return;
        }

        currentQuestion++;
        
        const progressPct = ((currentQuestion - 1) / totalQuestions) * 100;
        document.getElementById('progress-bar').style.width = `${progressPct}%`;
        
        const modeLabel = gameMode === 'practice' ? 'PRACTICE' : difficulty.toUpperCase();
        document.getElementById('mode-tag').innerText = `Question ${currentQuestion} of ${totalQuestions} (${modeLabel})`;
        document.getElementById('streak-val').innerText = streak;
        document.getElementById('feedback').innerText = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        generateQuestion();

        if (timerLimit > 0) {
            timeLeft = timerLimit;
            document.getElementById('timer-val').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        } else {
            document.getElementById('timer-val').innerText = '--';
        }
    }

    function generateQuestion() {
        let op = chosenOp;
        if (op === 'mixed') {
            const ops = ['plus', 'minus', 'multi', 'div'];
            op = ops[Math.floor(Math.random() * ops.length)];
        }

        let symbol = '';

        if (op === 'plus') {
            symbol = '+';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 10;
            } else {
                num1 = Math.floor(Math.random() * 450) + 50;
                num2 = Math.floor(Math.random() * 450) + 50;
            }
            correctAnswer = num1 + num2;

        } else if (op === 'minus') {
            symbol = '-';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                if (num1 < num2) [num1, num2] = [num2, num1];
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 10;
                if (num1 < num2) [num1, num2] = [num2, num1];
            } else {
                num1 = Math.floor(Math.random() * 200) + 10;
                num2 = Math.floor(Math.random() * 200) + 10;
            }
            correctAnswer = num1 - num2;

        } else if (op === 'multi') {
            symbol = '×';
            if (difficulty === 'easy') {
                num1 = Math.floor(Math.random() * 6) + 1;
                num2 = Math.floor(Math.random() * 6) + 1;
            } else if (difficulty === 'medium') {
                num1 = Math.floor(Math.random() * 12) + 2;
                num2 = Math.floor(Math.random() * 12) + 2;
            } else {
                num1 = Math.floor(Math.random() * 25) + 6;
                num2 = Math.floor(Math.random() * 25) + 6;
            }
            correctAnswer = num1 * num2;

        } else if (op === 'div') {
            symbol = '÷';
            if (difficulty === 'easy') {
                num2 = Math.floor(Math.random() * 5) + 1;
                correctAnswer = Math.floor(Math.random() * 5) + 1;
            } else if (difficulty === 'medium') {
                num2 = Math.floor(Math.random() * 10) + 2;
                correctAnswer = Math.floor(Math.random() * 10) + 1;
            } else {
                num2 = Math.floor(Math.random() * 20) + 5;
                correctAnswer = Math.floor(Math.random() * 25) + 2;
            }
            num1 = num2 * correctAnswer;
        }

        document.getElementById('question').innerText = `${num1} ${symbol} ${num2}`;
    }

    function checkAnswer() {
        clearInterval(timerInterval);
        const inputField = document.getElementById('answer-input');
        const userAns = parseInt(inputField.value);
        const feedback = document.getElementById('feedback');
        const qText = document.getElementById('question').innerText;

        if (isNaN(userAns)) return;

        const isCorrect = (userAns === correctAnswer);
        questionHistory.push({ question: qText, userAns: userAns, correct: correctAnswer, isCorrect: isCorrect });

        if (isCorrect) {
            score++;
            streak++;
            playSound('correct');
            feedback.innerText = "Correct!";
            feedback.style.color = "var(--success-color)";
        } else {
            streak = 0;
            playSound('wrong');
            feedback.innerText = `Incorrect. Answer: ${correctAnswer}`;
            feedback.style.color = "var(--danger-color)";
        }

        setTimeout(nextQuestion, 1000);
    }

    function handleTimeout() {
        streak = 0;
        playSound('wrong');
        const qText = document.getElementById('question').innerText;
        questionHistory.push({ question: qText, userAns: "Timed Out", correct: correctAnswer, isCorrect: false });
        
        const feedback = document.getElementById('feedback');
        feedback.innerText = `Time's up! Answer: ${correctAnswer}`;
        feedback.style.color = "var(--danger-color)";
        setTimeout(nextQuestion, 1000);
    }

    function endGame() {
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        // Calculate and display accuracy percentage
        const accuracyPct = Math.round((score / totalQuestions) * 100);
        document.getElementById('final-stats').innerText = `${currentUser}, you scored ${score} out of ${totalQuestions}!`;
        document.getElementById('accuracy-stat').innerText = `Accuracy: ${accuracyPct}%`;

        // Render Review Table
        const reviewBody = document.getElementById('review-body');
        reviewBody.innerHTML = '';
        questionHistory.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = item.isCorrect ? 'correct-row' : 'incorrect-row';
            tr.innerHTML = `<td>${item.question}</td><td>${item.userAns}</td><td>${item.correct}</td>`;
            reviewBody.appendChild(tr);
        });

        // Hide leaderboard in Practice Mode, save scores in Quiz Mode
        const leaderboardTitle = document.getElementById('leaderboard-title');
        const leaderboardTable = document.getElementById('leaderboard-table');

        if (gameMode === 'practice') {
            leaderboardTitle.style.display = 'none';
            leaderboardTable.style.display = 'none';
        } else {
            leaderboardTitle.style.display = 'block';
            leaderboardTable.style.display = 'table';

            const storageKey = `math_quest_best_${currentUser}`;
            const previousBest = parseInt(localStorage.getItem(storageKey) || 0);

            if (score > previousBest) {
                localStorage.setItem(storageKey, score);
            }
            updateLeaderboard();
        }

        if (accuracyPct >= 80) {
            launchConfetti();
        }
    }

    function updateLeaderboard() {
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        let scores = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('math_quest_best_')) {
                const name = key.replace('math_quest_best_', '');
                const val = parseInt(localStorage.getItem(key));
                scores.push({ name, score: val });
            }
        }

        scores.sort((a, b) => b.score - a.score);

        scores.slice(0, 5).forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${item.name}</td><td>${item.score}</td>`;
            tbody.appendChild(tr);
        });
    }

    function resetGame() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });

    function launchConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#0dcaf0'];

        for (let i = 0; i < 80; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.7) * 12,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 6 + 4,
                alpha: 1
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.alpha -= 0.015;

                if (p.alpha > 0) {
                    active = true;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (active) {
                requestAnimationFrame(render);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        render();
    }
</script>

</body>
</html>
